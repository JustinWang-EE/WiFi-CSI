[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-densepose"
version = "0.1.0"
description = "Compact WiFi CSI to 3D human pose research baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
  "torch>=2.1",
]

[project.scripts]
wifi-densepose-train = "wifi_densepose.train:main"
wifi-densepose-evaluate = "wifi_densepose.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

